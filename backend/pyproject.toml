[project]
name = "resumeiq-backend"
version = "0.1.0"
description = "ResumeIQ AI Backend & ATS Analysis Engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "firebase-admin>=6.6.0",
    "google-genai>=2.19.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"
