name: CI

on:
  push:
    branches: [ main, master, consolidation ]
  pull_request:
    branches: [ main, master, consolidation ]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run Backend Tests
        id: pytest_run
        env:
          PYTHONPATH: backend
          FIREBASE_PROJECT_ID: resumeiq-3cfe6
          ENVIRONMENT: test
          AI_ANALYZER_PROVIDER: groq
        run: |
          python -m pytest backend/tests -v --tb=short 2>&1 | tee /tmp/pytest_out.txt

      - name: Report Pytest Failures
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import os, urllib.request, json
          try:
              summary = ''
              if os.path.exists('/tmp/pytest_out.txt'):
                  with open('/tmp/pytest_out.txt', 'r', encoding='utf-8', errors='ignore') as f:
                      lines = f.readlines()
                      summary = ''.join(lines[-100:])
              body = {'body': '### CI Backend Test Failure Log:\n```\n' + summary[-3500:] + '\n```'}
              repo = os.environ.get('GITHUB_REPOSITORY', 'RuthiRaj/resume-iq')
              sha = os.environ.get('GITHUB_SHA')
              token = os.environ.get('GH_TOKEN')
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/commits/{sha}/comments',
                  headers={'Authorization': f'Bearer {token}', 'User-Agent': 'CI-Reporter', 'Content-Type': 'application/json'},
                  data=json.dumps(body).encode()
              )
              urllib.request.urlopen(req)
              print('Successfully posted failure comment to commit!')
          except Exception as e:
              print('Failed to post commit comment:', e)
          "




  frontend-check:
    name: Frontend Typecheck, Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production Build (Next.js Standalone)
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build

      - name: Guard - no E2E mocks in production bundle
        run: |
          test -d .next/static || { echo "build output not found"; exit 1; }
          if grep -r "__E2E_MOCK" .next/static; then
            echo "E2E mock code found in production bundle"; exit 1
          fi

  docker-build-check:
    name: Docker OCI Multi-Stage Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend OCI Image
        run: |
          docker build --file backend/Dockerfile --tag resumeiq-backend:ci ./backend

      - name: Build Frontend OCI Image
        run: |
          docker build --file frontend/Dockerfile --tag resumeiq-frontend:ci ./frontend

  e2e-test:
    name: Playwright E2E Test Suite
    runs-on: ubuntu-latest
    needs: [frontend-check]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Build Next.js Application
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          NEXT_PUBLIC_E2E: "true"
          NEXT_PUBLIC_E2E_TEST_MODE: "true"
        run: npm run build

      - name: Run Playwright E2E Tests
        env:
          CI: "true"
          NEXT_PUBLIC_E2E: "true"
          NEXT_PUBLIC_E2E_TEST_MODE: "true"
        run: npx playwright test

      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
